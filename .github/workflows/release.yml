# Builds release binaries, .deb, .rpm, and portable .tar.gz archives on v* tags (or manual dispatch).
name: Release & Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Build .deb & .rpm (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y liblcms2-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Determine version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build release binaries
        run: cargo build --release --locked

      - name: Run unit tests
        run: cargo test --release --locked

      - name: Install nFPM
        uses: goreleaser/nfpm-action@v2

      - name: Build .deb, .rpm, and portable archive
        run: |
          chmod +x packaging/postinstall.sh packaging/postremove.sh icc/fetch_icc_profiles.sh
          mkdir -p dist
          nfpm package --config nfpm.yaml --packager deb --target "dist/epson-p900-escpr-cups_${VERSION}_amd64.deb"
          nfpm package --config nfpm.yaml --packager rpm --target "dist/epson-p900-escpr-cups-${VERSION}-1.x86_64.rpm"
          STAGE="epson-p900-escpr-cups-${VERSION}-linux-x86_64"
          mkdir -p "dist/${STAGE}/icc" "dist/${STAGE}/share/polkit-1/actions"
          cp target/release/rastertop900escpr target/release/epson-p900-media-install "dist/${STAGE}/"
          cp install.sh README.md CHANGELOG.md LICENSE "dist/${STAGE}/"
          cp icc/fetch_icc_profiles.sh "dist/${STAGE}/icc/"
          cp share/polkit-1/actions/de.colorcube.epson-p900-escpr.install-media.policy "dist/${STAGE}/share/polkit-1/actions/"
          tar -C dist -czf "dist/${STAGE}.tar.gz" "${STAGE}"
          rm -rf "dist/${STAGE}"
          (cd dist && sha256sum *.deb *.rpm *.tar.gz > SHA256SUMS)
          ls -lh dist/

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: epson-p900-escpr-cups-${{ steps.version.outputs.version }}-packages
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/SHA256SUMS

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/SHA256SUMS
