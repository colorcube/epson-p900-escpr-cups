name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install liblcms2
        run: sudo apt-get update && sudo apt-get install -y liblcms2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --check
      - name: Build
        run: cargo build --locked
      - name: Test
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --locked --all-targets
      - name: Feature table and PPDs up to date
        run: |
          cargo run --locked -- --generate-feature-table --check
          cargo run --locked -- --generate-ppd --ppd-dir ppd
          git diff --exit-code ppd
