[package]
name = "epson-p900-escpr-cups"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
description = "Linux CUPS driver and ESC/P-R Level 5 + Official ICC streaming filter for Epson SureColor SC-P900 and SC-P700"

[[bin]]
name = "rastertop900escpr"
path = "src/main.rs"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "2"
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
